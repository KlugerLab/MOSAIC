url: https://klugerlab.github.io/MOSAIC/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [home, quickstart, reference]
    right: [github]
  components:
    quickstart:
      text: Quick Start
      href: articles/quick_start.html
    reference:
      text: Functions
      href: reference/index.html
    github:
      icon: fa-github
      href: https://github.com/KlugerLab/MOSAIC
      aria-label: GitHub

reference:
  - title: "Core Embedding"
    desc: "Run the MOSAIC spectral co-embedding pipeline"
